├── existing-12-week-course/       # Preserve existing content
│
└── clement-sutton-university/
    ├── README.md
    ├── PRD.md
    ├── governance/
    ├── admissions/
    ├── early-childhood-k12/
    ├── colleges-and-degrees/
    ├── seven-pillars/
    ├── research-laboratories/
    ├── black-history-museum/
    ├── international-exchange/
    ├── academic-publishing/
    ├── scholarships/
    ├── career-and-business-network/
    ├── funding/
