name: Setup Clement-Sutton University

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-university:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create missing university structure
        shell: bash
        run: |
          set -euo pipefail
          ROOT="clement-sutton-university"

          mkdir -p \
            "$ROOT/governance" \
            "$ROOT/admissions" \
            "$ROOT/early-childhood-k12" \
            "$ROOT/colleges-and-degrees" \
            "$ROOT/seven-pillars" \
            "$ROOT/research-laboratories" \
            "$ROOT/black-history-museum" \
            "$ROOT/international-exchange" \
            "$ROOT/academic-publishing" \
            "$ROOT/scholarships" \
            "$ROOT/career-and-business-network" \
            "$ROOT/funding/LND-treasury" \
            "$ROOT/funding/capital-budget" \
            "$ROOT/funding/financial-reporting" \
            "$ROOT/technology" \
            "$ROOT/aws-deployment"

          # Write the complete top-level README before adding placeholders.
          if [ ! -f "$ROOT/README.md" ]; then
            cat > "$ROOT/README.md" <<'EOF'
          # Clement-Sutton University

          **African, Caribbean & Indigenous Diaspora University**

          ## Institutional Framework
          Clement-Sutton University is an educational development initiative within the State of Loc Nation Global Public Benefit Corporation (SOLN GPBC) framework, building upon SOLN's charter, research, publications, governance work, and the After Revelations curriculum.

          ## Seven Pillars
          1. Education
          2. Economics
          3. Health
          4. Technology
          5. Media and Culture
          6. Policy and Law
          7. Spirituality and Wellness

          ## Institutional Development
          - Early childhood through doctoral education
          - Eight research laboratories
          - Black History Museum and cultural archives
          - International exchange and scholarships
          - Academic publishing and research archives
          - Black-owned business and career partnerships
          - LND treasury, capital budgets and financial reporting
          - AWS and digital learning infrastructure

          ## Preservation
          This module supplements the existing After Revelations 12-week course. Existing course content, university files, and Git history remain unchanged.

          ## Institutional Records
          Governance actions, academic authorizations, operational milestones, and financial commitments are recorded in their respective institutional records.
          EOF
          fi

          if [ ! -f "$ROOT/PRD.md" ]; then
            cat > "$ROOT/PRD.md" <<'EOF'
          # Clement-Sutton University — Product Requirements Document

          ## Objective
          Implement the complete university ecosystem while preserving the existing After Revelations 12-week course.

          ## Academic Platform
          Admissions, enrollment, course catalog, learning management, student records, faculty dashboards, curriculum and graduation workflows.

          ## Research and Publishing
          Eight research laboratories; ORCID, Zotero, Zenodo and DOI workflows; journal publishing, peer review, and archival records.

          ## Culture and International Exchange
          Black History Museum, Indigenous and Afro-diasporic heritage archives, student exchanges and ancestral recognition.

          ## Employment and Financial Systems
          Black-owned business partnerships, scholarships, internships, LND allocation ledger, settlement records, capital budgets and financial reporting.

          ## Technology
          GitHub source control, AWS infrastructure, identity and role-based access, database backups, testing and deployment.

          ## Preservation Rule
          Do not delete, rename, relocate or overwrite existing repository files. This workflow creates missing documentation only.
          EOF
          fi

          # Git does not track empty directories; add documentation only where absent.
          find "$ROOT" -type d -print0 | while IFS= read -r -d '' dir; do
            if [ ! -f "$dir/README.md" ]; then
              printf '# %s\n\nClement-Sutton University division documentation.\n' \
                "$(basename "$dir")" > "$dir/README.md"
            fi
          done

      - name: Commit newly created files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clement-sutton-university/
          if git diff --cached --quiet; then
            echo "All framework files already exist; no changes needed."
            exit 0
          fi
          git commit -m "Add missing Clement-Sutton University framework files"
          git push
